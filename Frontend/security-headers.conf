# Security headers for the website's own pages and files (included per location,
# because nginx drops inherited add_header lines when a location sets its own).
# 'wasm-unsafe-eval' lets the emulator's WebAssembly compile; nothing else may run
# that isn't a file from this site.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self), gamepad=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
