server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # API requests go to the Backend service (see compose.yml)
    location /api/ {
        # Room for an 8 MB ROM plus a 5 MB cover in one upload; the Backend enforces the real limits
        client_max_body_size 14m;

        proxy_pass http://backend:5000;
        # $http_host keeps the port, so the Backend can check where requests come from
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Only the visitor's address, so the Backend's single trusted hop is always it
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The emulator's files keep the same names between builds, so check for updates
    location /emulator/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
