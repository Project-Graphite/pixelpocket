services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-pixelpocket}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:27017:27017"

  minio:
    image: chainguard/minio@sha256:25bc63a89475bc494bfbce9bbeddb0421aece3f3968d77c809db5104d07b4545
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
      - ./infra/minio:/scripts:ro
    healthcheck:
      test: ["CMD", "bash", "/scripts/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:9001:9001"

  minio-init:
    image: chainguard/minio@sha256:25bc63a89475bc494bfbce9bbeddb0421aece3f3968d77c809db5104d07b4545
    entrypoint: ["bash", "/scripts/init.sh"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-pixelpocket}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pixelpocket-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - ./infra/minio:/scripts:ro

  backend:
    build: ./Backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DATABASE_LOCAL: mongodb://${MONGO_USER:-pixelpocket}:${MONGO_PASSWORD}@mongo:27017/pixelpocket?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-90d}
      JWT_COOKIE_EXPIRES_IN: ${JWT_COOKIE_EXPIRES_IN:-90}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-PixelPocket <noreply@pixelpocket.local>}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-pixelpocket}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pixelpocket-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  frontend:
    build:
      context: ./Frontend
      # The Frontend image compiles the emulator to WebAssembly from this folder
      additional_contexts:
        emulator: ./gb-emulator
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

  # Builds the emulator and runs its tests: docker compose --profile test run --rm emulator-tests
  emulator-tests:
    build:
      context: ./gb-emulator
      target: test
    profiles: ["test"]

volumes:
  mongo-data:
  minio-data:
